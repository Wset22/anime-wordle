<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Name Guess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* ---------- COLORS: change these to restyle the whole app ---------- */
:root {
  --bg: #f3f0fb;
  --panel: #ffffff;
  --text: #1d1b3a;
  --muted: #6b6890;
  --empty: #d9d5ee;
  --correct: #2fa66a;   /* right letter, right spot */
  --present: #e0a526;   /* right letter, wrong spot */
  --absent: #8a87a8;    /* letter not in the name */
  --accent: #e0457b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122b; --panel: #201d42; --text: #f1eeff; --muted: #a9a5d0;
    --empty: #383464; --absent: #4b4777;
  }
}
:root[data-theme="dark"] {
  --bg: #14122b; --panel: #201d42; --text: #f1eeff; --muted: #a9a5d0;
  --empty: #383464; --absent: #4b4777;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 12px 32px; min-height: 100vh;
}
h1 {
  font-family: "Dela Gothic One", "Arial Black", sans-serif;
  font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.4rem);
  margin: 0 0 4px; letter-spacing: .02em;
}
.sub { color: var(--muted); margin: 0 0 16px; }
.clue {
  background: var(--panel); border-radius: 999px; padding: 8px 18px;
  font-weight: 700; margin-bottom: 16px; border: 2px solid var(--accent);
}
#board { display: grid; gap: 6px; margin-bottom: 16px; max-width: 100%; }
.row { display: flex; gap: 6px; justify-content: center; }
.tile {
  width: clamp(36px, 11vw, 56px); aspect-ratio: 1;
  display: grid; place-items: center;
  font-weight: 700; font-size: clamp(1.1rem, 5vw, 1.7rem);
  background: var(--panel); border: 2px solid var(--empty); border-radius: 8px;
}
.tile.filled { border-color: var(--muted); }
.tile.correct, .tile.present, .tile.absent { color: #fff; border-color: transparent; }
.tile.correct { background: var(--correct); }
.tile.present { background: var(--present); }
.tile.absent  { background: var(--absent); }
#message { min-height: 1.6em; font-weight: 700; margin-bottom: 10px; text-align: center; }
#keyboard { display: grid; gap: 6px; width: 100%; max-width: 480px; }
.krow { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 8px;
  background: var(--empty); color: var(--text);
  font: 700 1rem "Zen Maru Gothic", system-ui, sans-serif; cursor: pointer;
}
.key.wide { flex: 1.6; font-size: .8rem; }
.key.correct { background: var(--correct); color: #fff; }
.key.present { background: var(--present); color: #fff; }
.key.absent  { background: var(--absent); color: #fff; }
.key:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 999px;
  background: var(--accent); color: #fff; font: 700 1rem "Zen Maru Gothic", system-ui, sans-serif;
  cursor: pointer;
}
.stats { color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<h1>Anime Name Guess</h1>
<p class="sub">Guess the character’s name in 6 tries.</p>
<div class="clue" id="clue"></div>
<div id="board" aria-label="Guess board"></div>
<div id="message" role="status"></div>
<div id="keyboard"></div>
<button class="btn" id="newGame">New character</button>
<div class="stats" id="stats"></div>

<script>
/* ---------- 1. DATA: add your own characters here! ----------
   name must be letters only (A-Z). anime is the clue shown to the player. */
const CHARACTERS = [
  { name: "LUFFY",   anime: "One Piece" },
  { name: "ZORO",    anime: "One Piece" },
  { name: "NAMI",    anime: "One Piece" },
  { name: "NARUTO",  anime: "Naruto" },
  { name: "SASUKE",  anime: "Naruto" },
  { name: "SAKURA",  anime: "Naruto" },
  { name: "KAKASHI", anime: "Naruto" },
  { name: "GOKU",    anime: "Dragon Ball" },
  { name: "VEGETA",  anime: "Dragon Ball" },
  { name: "GOHAN",   anime: "Dragon Ball" },
  { name: "EREN",    anime: "Attack on Titan" },
  { name: "MIKASA",  anime: "Attack on Titan" },
  { name: "LEVI",    anime: "Attack on Titan" },
  { name: "TANJIRO", anime: "Demon Slayer" },
  { name: "NEZUKO",  anime: "Demon Slayer" },
  { name: "ZENITSU", anime: "Demon Slayer" },
  { name: "DEKU",    anime: "My Hero Academia" },
  { name: "BAKUGO",  anime: "My Hero Academia" },
  { name: "GON",     anime: "Hunter x Hunter" },
  { name: "KILLUA",  anime: "Hunter x Hunter" },
  { name: "LIGHT",   anime: "Death Note" },
  { name: "SAITAMA", anime: "One Punch Man" },
  { name: "SPIKE",   anime: "Cowboy Bebop" },
  { name: "ANYA",    anime: "Spy x Family" },
  { name: "SHINJI",  anime: "Evangelion" },
  { name: "ASUKA",   anime: "Evangelion" },
  { name: "ASTA",  anime: "Black Clover" },
  { name: "YUNO",  anime: "Black Clover" },
  { name: "LOID",  anime: "Spy x Family" },
  { name: "YOR",  anime: "Spy x Family" }
];
const MAX_TRIES = 6;

/* ---------- 2. STATE: what the game remembers ---------- */
let secret = "";        // the hidden name
let guesses = [];       // list of finished guesses
let current = "";       // the guess being typed
let gameOver = false;
let wins = 0, played = 0;
let keyColors = {};     // letter -> "correct" | "present" | "absent"

const boardEl = document.getElementById("board");
const keyboardEl = document.getElementById("keyboard");
const messageEl = document.getElementById("message");

/* ---------- 3. SCORING: decide each tile’s color ---------- */
function scoreGuess(guess, answer) {
  const result = Array(answer.length).fill("absent");
  const leftover = answer.split("");
  // Pass 1: exact matches (green)
  for (let i = 0; i < guess.length; i++) {
    if (guess[i] === answer[i]) { result[i] = "correct"; leftover[i] = null; }
  }
  // Pass 2: right letter, wrong spot (yellow)
  for (let i = 0; i < guess.length; i++) {
    if (result[i] === "correct") continue;
    const j = leftover.indexOf(guess[i]);
    if (j !== -1) { result[i] = "present"; leftover[j] = null; }
  }
  return result;
}

/* ---------- 4. DRAWING: turn the state into what you see ---------- */
function drawBoard() {
  boardEl.innerHTML = "";
  for (let r = 0; r < MAX_TRIES; r++) {
    const row = document.createElement("div");
    row.className = "row";
    const done = guesses[r];                 // a finished guess, if any
    const typing = r === guesses.length ? current : "";
    const colors = done ? scoreGuess(done, secret) : [];
    for (let c = 0; c < secret.length; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      const letter = done ? done[c] : typing[c];
      if (letter) { tile.textContent = letter; tile.classList.add("filled"); }
      if (done) tile.classList.add(colors[c]);
      row.appendChild(tile);
    }
    boardEl.appendChild(row);
  }
}

function drawKeyboard() {
  const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  keyboardEl.innerHTML = "";
  rows.forEach((letters, i) => {
    const row = document.createElement("div");
    row.className = "krow";
    if (i === 2) row.appendChild(makeKey("ENTER", "Enter", true));
    for (const ch of letters) row.appendChild(makeKey(ch, ch, false));
    if (i === 2) row.appendChild(makeKey("DEL", "Backspace", true));
    keyboardEl.appendChild(row);
  });
}

function makeKey(label, value, wide) {
  const b = document.createElement("button");
  b.className = "key" + (wide ? " wide" : "") + (keyColors[value] ? " " + keyColors[value] : "");
  b.textContent = label;
  b.onclick = () => handleKey(value);        // CLICK -> handleKey
  return b;
}

function say(text) { messageEl.textContent = text; }

/* ---------- 5. INPUT: what happens when you press a key ---------- */
function handleKey(key) {
  if (gameOver) return;
  if (key === "Enter") return submitGuess();
  if (key === "Backspace") { current = current.slice(0, -1); }
  else if (/^[A-Za-z]$/.test(key) && current.length < secret.length) {
    current += key.toUpperCase();
  }
  say("");
  drawBoard();
}

function submitGuess() {
  if (current.length < secret.length) {
    say("Not enough letters — this name has " + secret.length + ".");
    return;
  }
  guesses.push(current);
  // update keyboard colors (green beats yellow beats gray)
  const colors = scoreGuess(current, secret);
  const rank = { absent: 1, present: 2, correct: 3 };
  for (let i = 0; i < current.length; i++) {
    const ch = current[i];
    if (!keyColors[ch] || rank[colors[i]] > rank[keyColors[ch]]) keyColors[ch] = colors[i];
  }
  const won = current === secret;
  current = "";
  if (won) endGame(true);
  else if (guesses.length === MAX_TRIES) endGame(false);
  drawBoard();
  drawKeyboard();
}

function endGame(won) {
  gameOver = true;
  played++;
  if (won) {
    wins++;
    say("You got it! " + secret + " in " + guesses.length + " tries.");
  } else {
    say("Out of tries. It was " + secret + ".");
  }
  document.getElementById("stats").textContent = "Wins: " + wins + " / " + played;
}

/* ---------- 6. NEW GAME ---------- */
function newGame() {
  const pick = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  secret = pick.name;
  guesses = []; current = ""; gameOver = false; keyColors = {};
  document.getElementById("clue").textContent = "From: " + pick.anime + " · " + secret.length + " letters";
  say("");
  drawBoard();
  drawKeyboard();
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  handleKey(e.key);
});
document.getElementById("newGame").onclick = newGame;
newGame();
</script>
</body>
</html>
